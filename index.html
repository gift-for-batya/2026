<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="scene">
        <div class="text-content top-text">
            <h1 class="hidden" id="text-hbd">🎉 С ДНЁМ РОЖДЕНИЯ</h1>
            <h2 class="hidden" id="text-dad">❤️ БАТЯ!!! ❤️</h2>
        </div>

        <div class="gift-container" id="gift-container">
            <div class="gift-box" id="gift-box">
                <!-- Using clip-path to separate lid and base in CSS -->
                <div class="gift-part gift-base"></div>
                <div class="gift-part gift-lid"></div>
            </div>
            <p class="click-text" id="click-text">🎁 Нажми на подарок</p>
        </div>

        <div class="certificate-container" id="cert-container">
            <!-- Using onerror fallback to handle both .jpg and .png just in case -->
            <img src="1certificate.jpg" alt="Сертификат" class="certificate" id="certificate">
        </div>

        <div class="text-content bottom-text">
            <p class="hidden wish" id="text-wish">Желаю крепкого здоровья, лёгкой спины и чтобы всё было сабай-сабай! 🇹🇭❤️</p>
        </div>
    </div>

    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
